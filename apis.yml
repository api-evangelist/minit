name: Minit
description: Minit was a process-mining software company founded in 2015 and headquartered in Bratislava,
  Slovakia. Its platform ingested event-log data from systems of record (ERP, CRM, service desks) to
  reconstruct, visualize, and analyze how business processes actually run, surfacing bottlenecks, rework,
  compliance gaps, and automation opportunities. Backed by Earlybird Venture Capital (among other investors),
  Minit was acquired by Microsoft in March 2022, and its process-mining technology was folded into Microsoft
  Power Automate Process Mining (process advisor). The standalone Minit product, developer surface, and
  minit.io site have been retired; the domain now resolves through Microsoft-controlled Azure DNS and no
  longer serves a public site or API. This profile is retained as a network record of an acquired company;
  there is no independent Minit API to enrich.
